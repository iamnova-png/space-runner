<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Space Runner 🚀</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>
    <div id="ui">
      <div id="score">0</div>
      <div id="coins">🪙 0</div>
    </div>
    <div id="start-screen">
      <h1>🚀 Space Runner</h1>
      <p>Tap to jump • Hold for higher!</p>
      <div id="high-score">Best: 0</div>
      <div class="powerup-legend">
        <span>🛡️ Shield</span>
        <span>🧲 Magnet</span>
        <span>💰 2x Coins</span>
      </div>
      <button id="start-btn">START</button>
    </div>
    <div id="char-select" class="hidden">
      <h1>Choose Your Pilot</h1>
      <div class="char-options">
        <div class="char-option" data-char="spacekid">
          <canvas id="char-preview-0" width="80" height="80"></canvas>
          <span>Space Kid</span>
        </div>
        <div class="char-option" data-char="hovercraft">
          <canvas id="char-preview-1" width="80" height="80"></canvas>
          <span>Hovercraft</span>
        </div>
        <div class="char-option" data-char="alien">
          <canvas id="char-preview-2" width="80" height="80"></canvas>
          <span>Alien UFO</span>
        </div>
      </div>
      <p class="char-hint">Tap to select</p>
    </div>
    <div id="game-over" class="hidden">
      <h1>Game Over!</h1>
      <p>Score: <span id="final-score">0</span></p>
      <p>Coins: <span id="final-coins">0</span></p>
      <p id="new-high-score" class="hidden">🏆 NEW HIGH SCORE!</p>
      <button id="restart-btn">PLAY AGAIN</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
